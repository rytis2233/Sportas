# Builds the Sun Path iPhone app (unsigned .ipa) on a Mac runner.
# Install it on an iPhone from Windows with Sideloadly (it signs the app with your Apple ID).
name: Sun Path iPhone app

on:
  push:
    paths:
      - "sun-path-ios/**"
      - ".github/workflows/sun-path-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: sun-path-ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: sun-path-ios
        run: |
          set -o pipefail
          xcodebuild -project SunPath.xcodeproj -target SunPath -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)?|BUILD (SUCCEEDED|FAILED)" | grep -v "deprecated" || true
          echo "----- errors -----"
          grep -E "error:" build.log | sort -u | head -n 80 || true
          test -d build/Release-iphoneos/SunPath.app

      - name: Package .ipa
        working-directory: sun-path-ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SunPath.app Payload/
          zip -qry SunPath.ipa Payload
          ls -la SunPath.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SunPath-ipa
          path: sun-path-ios/SunPath.ipa

      - name: Publish download (release "sun-path-ios")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sun-path-ios --yes --cleanup-tag || true
          gh release create sun-path-ios sun-path-ios/SunPath.ipa --target "${{ github.sha }}" \
            --title "Sun Path for iPhone" \
            --notes "Download SunPath.ipa and install it with Sideloadly (Windows) using your Apple ID. See sun-path-ios/README.md."
