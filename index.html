<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jėgos">
<meta name="theme-color" content="#0F1215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Jėgos žurnalas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone app shell — sticky header with the five training days, one scrolling view (workout / progress / history), rest timer docked above a bottom tab bar, full-screen timer on tap. */
:root {
  --bg: #E8EBEE;
  --surface: #F7F8F9;
  --ink: #14181D;
  --muted: #5B6470;
  --line: #CCD2D9;
  --accent: #2343BF;      /* competition 20 kg plate blue */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE3FA;
  --good: #23704A;
  --good-soft: #D8EEE1;
  --warn: #9A6412;
  --warn-soft: #F6E7CC;
  --danger: #B42318;
  --bar-bg: rgba(232, 235, 238, 0.92);
  /* plate colours — physical colours, identical in both themes */
  --p25: #D2302C; --p20: #2343BF; --p15: #E3B416; --p10: #2F8A4C; --p5: #F4F4F2; --p2-5: #D2302C; --p1-25: #B9BEC5;
  --plate-dark: #14181D; --plate-light: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  --tab-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #181C21; --ink: #E7EBEF; --muted: #97A1AC; --line: #2A3139;
    --accent: #7E9BFF; --accent-ink: #0F1215; --accent-soft: #1E2847;
    --good: #5CC48A; --good-soft: #17301F; --warn: #E2AA4D; --warn-soft: #33270F; --danger: #F2796B;
    --bar-bg: rgba(15, 18, 21, 0.92);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #181C21; --ink: #E7EBEF; --muted: #97A1AC; --line: #2A3139;
  --accent: #7E9BFF; --accent-ink: #0F1215; --accent-soft: #1E2847;
  --good: #5CC48A; --good-soft: #17301F; --warn: #E2AA4D; --warn-soft: #33270F; --danger: #F2796B;
  --bar-bg: rgba(15, 18, 21, 0.92);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 0 calc(var(--tab-h) + 120px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 620px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: var(--bar-bg); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); margin-inline: -16px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); }
.top-row { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.date { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: .9; text-transform: uppercase; margin: 2px 0 0; letter-spacing: .01em; }
.status { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-s="db"]::before { background: var(--good); }
.status[data-s="local"]::before { background: var(--warn); }
.status[data-s="err"] { color: var(--danger); }
.status[data-s="err"]::before { background: var(--danger); }
.days { max-width: 620px; margin: 12px auto 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.days button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; position: relative; }
.days b { font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.days small { font-size: 11px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.days button[aria-pressed="true"] small { color: inherit; opacity: .7; }
.days button[data-today="1"]::after { content: ""; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.days button[data-done="1"] b::after { content: " ✓"; font-size: 13px; }

main { display: flex; flex-direction: column; gap: 22px; padding-top: 18px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; text-wrap: balance; }
.hint { color: var(--muted); font-size: 13px; }

/* banners */
.banner { border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); }
.banner b { font-weight: 600; }
.banner[data-t="deload"] { background: var(--good-soft); border-color: transparent; }
.banner[data-t="due"] { background: var(--warn-soft); border-color: transparent; }
.banner .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cycle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.weeks { display: flex; gap: 3px; }
.weeks i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.weeks i.on { background: var(--accent); }
.weeks i.due { background: var(--warn); }

.prog { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.prog .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.prog b { font-family: var(--display); font-size: 18px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* exercise list */
.exlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ex { border-bottom: 1px solid var(--line); }
.ex-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 2px; background: none; border: 0; text-align: left; }
.ex-idx { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--muted); line-height: 1; }
.ex[data-open="1"] .ex-idx { color: var(--accent); }
.ex[data-done="1"] .ex-idx { color: var(--good); }
.ex-name { font-weight: 600; font-size: 16px; display: block; }
.ex-meta { font-size: 13px; color: var(--muted); display: block; }
.ex-meta .tgt { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .02em; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 76px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.on { background: var(--accent); border-color: var(--accent); }
.ex[data-done="1"] .dot.on { background: var(--good); border-color: var(--good); }

.logger { padding: 0 2px 18px 42px; display: flex; flex-direction: column; gap: 12px; }
.advice { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
.advice b { font-weight: 600; }
.advice .last { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.advice[data-t="up"] { box-shadow: inset 3px 0 0 var(--good); }
.advice[data-t="hold"] { box-shadow: inset 3px 0 0 var(--warn); }
.advice[data-t="deload"] { background: var(--good-soft); }
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inputs.one { grid-template-columns: 1fr; }
.field label { display: block; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stepper button { border: 0; background: none; font-size: 24px; font-weight: 500; color: var(--accent); touch-action: manipulation; }
.stepper button:active { background: var(--accent-soft); }
.stepper input { min-width: 0; width: 100%; border: 0; background: none; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 600; padding: 6px 0; font-variant-numeric: tabular-nums; }
.stepper input:focus { outline: none; }
.stepper:focus-within { border-color: var(--accent); }
.plates { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.plate { font-family: var(--display); font-weight: 600; font-size: 13px; padding: 1px 7px; border-radius: 4px; color: var(--plate-light); }
.plate.lightp { color: var(--plate-dark); }
.plate.white { box-shadow: inset 0 0 0 1px var(--line); }
.add { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; padding: 15px; touch-action: manipulation; }
.add:active { filter: brightness(.92); }
a.add { display: block; text-align: center; text-decoration: none; }
.io { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); resize: vertical; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.steps b { font-weight: 600; }
.add:disabled { opacity: .5; }
.today { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 2px 2px 10px; background: var(--surface); }
.chip .num { font-family: var(--display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .x { border: 0; background: none; color: var(--muted); width: 30px; height: 30px; font-size: 17px; border-radius: 6px; }
.chip.miss { border-color: var(--warn); }
.chip.plain { padding-right: 10px; }

/* progress */
select.picker { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .empty { color: var(--muted); font-size: 14px; padding: 28px 8px; text-align: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { display: block; font-family: var(--display); font-size: 21px; color: var(--ink); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.records { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.records li { border-bottom: 1px solid var(--line); }
.records button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 2px; align-items: baseline; }
.records button:focus-visible { outline: 2px solid var(--accent); }
.records .n { font-weight: 500; }
.records .v { font-family: var(--display); font-size: 19px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.records .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }

/* history */
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.day-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.day-date { font-family: var(--display); font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pill { font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); }
.pill.dl { background: var(--good-soft); }
.day-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; font-size: 14px; padding: 4px 0; border-top: 1px dashed var(--line); align-items: center; }
.day-row:first-of-type { border-top: 0; }
.day-row .sets { font-family: var(--display); font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 10px; }
.day-row .sets .x { border: 0; background: none; color: var(--danger); padding: 0 2px; font-size: 15px; }
.link { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; }
.link.danger { color: var(--danger); font-weight: 600; }
.empty-state { color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: var(--r); padding: 18px; }
.settings { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--bar-bg); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tab-h); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tabs svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* rest timer (docked) */
.timer { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 7; padding: 0 10px 8px; }
.timer-in { max-width: 600px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px 10px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.timer-open { all: unset; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.timer-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer-time { font-family: var(--display); font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-btns { display: flex; gap: 6px; }
.timer-btns button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 9px; padding: 9px 11px; font-size: 14px; font-weight: 500; touch-action: manipulation; }
.timer-bar { grid-column: 1 / -1; height: 4px; background: rgba(127,127,127,.35); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.timer-bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.awake { font-size: 11px; opacity: .7; }
.timer[data-done="1"] .timer-in { background: var(--good); color: #fff; }
.timer[data-done="1"] .timer-bar { visibility: hidden; }

/* full-screen timer */
.big { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.big[data-done="1"] { background: var(--good); color: #fff; }
.big-label { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); max-width: 320px; }
.big[data-done="1"] .big-label { color: inherit; opacity: .85; }
.ring { position: relative; width: min(78vw, 340px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: min(24vw, 110px); font-variant-numeric: tabular-nums; }
.big-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.big-btns button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 500; min-width: 84px; }
.big[data-done="1"] .big-btns button { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.5); color: #fff; }
.big .awake { color: var(--muted); opacity: 1; }
.big[data-done="1"] .awake { color: inherit; }

.flash { position: fixed; inset: 0; z-index: 30; background: var(--good); pointer-events: none; opacity: 0; }
.keepvid { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }

@media (max-width: 400px) {
  .logger { padding-left: 2px; }
  h1 { font-size: 36px; }
  .days b { font-size: 15px; }
}
@media (prefers-reduced-motion: no-preference) {
  .timer[data-done="1"] .timer-time, .big[data-done="1"] .t { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .flash.on { animation: flash .9s ease-out 2; }
  @keyframes flash { 0% { opacity: .65; } 100% { opacity: 0; } }
}
</style>
</head>
<body>


<header class="top">
  <div class="top-row">
    <div>
      <div class="date" id="date-label">Šiandien</div>
      <h1 id="w-title">Pull</h1>
    </div>
    <span class="status" id="status" data-s="load">Jungiamasi…</span>
  </div>
  <div class="days" id="days" role="group" aria-label="Treniruotės diena"></div>
</header>

<div class="wrap">
  <main id="view-train"></main>
  <main id="view-prog" hidden></main>
  <main id="view-hist" hidden></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <button type="button" class="timer-open" data-action="big-open" aria-label="Atidaryti didelį laikmatį">
      <span class="timer-label" id="timer-label">Poilsis</span>
      <span class="timer-time" id="timer-time">0:00</span>
    </button>
    <div class="timer-btns">
      <button type="button" data-action="timer-add">+30 s</button>
      <button type="button" data-action="timer-stop" class="timer-stop">Baigti</button>
    </div>
    <div class="timer-bar"><i id="timer-fill"></i></div>
    <span class="awake" id="awake-small"></span>
  </div>
</div>

<div class="big" id="big" hidden>
  <div class="big-label" id="big-label">Poilsis</div>
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="5"/>
      <circle id="big-arc" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/>
    </svg>
    <div class="t" id="big-time">0:00</div>
  </div>
  <div class="big-btns">
    <button type="button" data-action="timer-sub">−15 s</button>
    <button type="button" data-action="timer-add">+30 s</button>
    <button type="button" data-action="timer-stop" class="timer-stop">Baigti</button>
  </div>
  <button type="button" class="link" data-action="big-close">Sutraukti</button>
  <span class="awake" id="awake-big"></span>
</div>

<div class="flash" id="flash"></div>

<nav class="tabs" aria-label="Skiltys">
  <div class="tabs-in">
    <button type="button" data-action="view" data-v="train" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M6.5 6.5v11M17.5 6.5v11M21 9v6M6.5 12h11"/></svg>
      Treniruotė
    </button>
    <button type="button" data-action="view" data-v="prog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      Progresas
    </button>

FwbWluPTAgcXBtYXg9NjkgcXBzdGVwPTQgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAAtliIQEfJigADYjgAAAAAZBmjgI+oAAAAAGQZpUAj6gAAAABUGaYBH1AAAABUGagBH1AAAABUGaoBH1AAAABUGawBH1AAAABUGa4BH1AAAABUGbABD1AAAABUGbID/U";

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const nf = new Intl.NumberFormat("lt-LT", { maximumFractionDigits: 2 });
  const fmt = n => nf.format(n);
  const numStr = v => (v === "" || v == null ? "" : String(v).replace(".", ","));
  const parseNum = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : NaN; };
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = () => keyOf(new Date());
  const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const diffDays = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 86400000);
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const longDate = k => { const d = dateOf(k); return cap(`${MONTHS[d.getMonth()]} ${d.getDate()} d., ${DOW_LONG[d.getDay()]}`); };
  const shortDate = k => { const d = dateOf(k); return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`; };
  const isDayKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  const repsTxt = it => (it.lo === it.hi ? `${it.lo}` : `${it.lo}–${it.hi}`);
  const roundTo = (v, step) => (step ? Math.round(v / step) * step : v);
  const IS_PWA = !!document.querySelector('link[rel="manifest"]');
  const PWA_URL = "https://rytis2233.github.io/sportas/";
  const SHORTCUT = "Poilsio laikmatis";
  const shortcutHref = sec => `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT)}&input=text&text=${sec}`;
  const restTxt = sec => (sec % 60 ? `${Math.floor(sec / 60)}:${pad(sec % 60)}` : `${sec / 60} min`);
  const mmss = sec => `${Math.floor(sec / 60)}:${pad(sec % 60)}`;
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

  /* ---------- state ---------- */
  const state = {
    days: {},
    settings: { bar: 20, cycleStart: null, deloadFrom: null, deloadTo: null },
    mode: "load",
    view: lsGet(LS_VIEW, "train"),
    w: null,
    wPicked: false,
    open: null,
    draft: {},
    chartEx: "pullups",
    confirmDel: null,
    editDay: null,
    histLimit: 15,
    io: null,
    ioMsg: "",
  };
  if (!["train", "prog", "hist"].includes(state.view)) state.view = "train";
  let col = null;
  let writeChain = Promise.resolve();

  const scheduled = dow => WORKOUTS.find(w => w.dow === dow) || null;
  function nextScheduled(fromKey) {
    for (let i = 1; i <= 7; i++) { const k = addDays(fromKey, i); const w = scheduled(dateOf(k).getDay()); if (w) return { w, k }; }
    return null;
  }
  function defaultWorkout() {
    const t = todayKey();
    const doc = state.days[t];
    if (doc && doc.w && WMAP[doc.w]) return doc.w;
    const w = scheduled(new Date().getDay());
    return w ? w.id : (nextScheduled(t) || { w: WORKOUTS[0] }).w.id;
  }

  /* ---------- data queries ---------- */
  const sortedKeys = () => Object.keys(state.days).filter(k => state.days[k] && state.days[k].sets && state.days[k].sets.length).sort();
  const setsFor = (k, ex) => ((state.days[k] && state.days[k].sets) || []).filter(x => x.ex === ex);
  function inferWorkout(doc) {
    if (doc.w && WMAP[doc.w]) return doc.w;
    let best = null, score = 0;
    const exs = new Set(doc.sets.map(x => x.ex));
    for (const w of WORKOUTS) { const sc = w.items.filter(i => exs.has(i.ex)).length; if (sc > score) { score = sc; best = w.id; } }
    return best;
  }
  function lastSession(ex) {
    const t = todayKey();
    const keys = sortedKeys().filter(k => k < t && !state.days[k].deload && setsFor(k, ex).length).reverse();
    return keys.length ? { key: keys[0], sets: setsFor(keys[0], ex) } : null;
  }
  function deloadActive(k = todayKey()) {
    const st = state.settings;
    return !!(st.deloadFrom && st.deloadTo && k >= st.deloadFrom && k <= st.deloadTo);
  }
  function cycleStartKey() {
    if (state.settings.cycleStart) return state.settings.cycleStart;
    const ks = sortedKeys();
    return ks.length ? ks[0] : null;
  }
  function cycleWeek() {
    const c = cycleStartKey();
    if (!c) return 0;
    return Math.max(1, Math.floor(diffDays(c, todayKey()) / 7) + 1);
  }
  const targetSets = it => (deloadActive() ? Math.ceil(it.sets / 2) : it.sets);

  function advice(it) {
    const e = EXD[it.ex];
    const last = lastSession(it.ex);
    const lastLine = last ? `Praeitą kartą (${shortDate(last.key)}): ` + last.sets.map(x => (e.noKg ? `${x.reps}` : `${fmt(x.kg)}×${x.reps}`)).join(", ") : "";
    if (deloadActive()) {
      const top = last ? Math.max(...last.sets.map(x => x.kg)) : 0;
      const kg = e.noKg ? 0 : roundTo(top * 0.6, e.step);
      return { t: "deload", kg: last ? kg : "", reps: it.lo, text: e.noKg || !last ? `<b>Deload:</b> lengvai, ${targetSets(it)} × ${it.lo}` : `<b>Deload: ${fmt(kg)} kg</b>, ${targetSets(it)} × ${it.lo}`, last: lastLine };
    }
    if (!last) {
      return { t: "new", kg: e.noKg || e.added ? 0 : "", reps: it.hi,
        text: e.added ? `Pirmas kartas. Pradėk nuo svorio, su kuriuo padarytum ${it.hi + 2} pak.` : `Pirmas kartas. Rinkis svorį, su kuriuo padarytum ${it.hi} pak. ir liktų 1–2 atsargoje.` };
    }
    if (e.noKg) {
      const ok = last.sets.length >= it.sets && last.sets.every(x => x.reps >= it.hi);
      return ok ? { t: "up", kg: 0, reps: it.hi, text: `Visi priėjimai po ${it.hi}. <b>Sunkink:</b> lėčiau ir toliau riedėk.`, last: lastLine }
                : { t: "same", kg: 0, reps: it.hi, text: `Siek <b>${it.sets} × ${it.hi}</b>`, last: lastLine };
    }
    const top = Math.max(...last.sets.map(x => x.kg));
    const atTop = last.sets.filter(x => x.kg === top);
    if (atTop.length >= it.sets && atTop.every(x => x.reps >= it.hi)) {
      const kg = +(top + e.inc).toFixed(2);
      return { t: "up", kg, reps: it.lo, text: `Visi priėjimai pavyko. <b>Kelk svorį: ${fmt(kg)} kg</b>`, last: lastLine };

    if (atTop.some(x => x.reps < it.lo)) {

  function draftFor(it) {
    const id = `${state.w}:${it.ex}`;
    if (!state.draft[id]) {
      const today = setsFor(todayKey(), it.ex);

  function plateMath(total) {
    const bar = state.settings.bar || 20;

    const out = [];
    for (const p of PLATES) while (side >= p - 1e-9) { out.push(p); side = +(side - p).toFixed(3); }

  }

  /* ---------- storage ---------- */
  function setStatus(mode, text) { const el = $("status"); el.dataset.s = mode; el.textContent = text; }

  async function initStore() {
    const c = window.claude;
    let db = null, uid = null;
    if (c && typeof c.use === "function") {
      try {
        const [d, u] = await Promise.all([c.use("db"), c.use("user")]);

    if (db && uid) {
      try {
        col = db.collection("data/users/" + uid);
        state.mode = "db";
        setStatus("db", "Išsaugota paskyroje");
        let first = true;
        col.onSnapshot(snap => {
          const days = {};
          snap.docs.forEach(d => {
            if (!d.exists) return;
            if (isDayKey(d.id)) days[d.id] = d.data();
            else if (d.id === "settings") state.settings = Object.assign({ bar: 20 }, d.data());

          state.days = days;

    state.mode = "local";
    setStatus("local", IS_PWA ? "Saugoma telefone" : "Tik šioje naršyklėje");

    if (!state.wPicked) state.w = defaultWorkout();
    render();

  function queue(fn) {

      queue(() => (copy ? ref.set(copy) : ref.delete()));

  function persistSettings() {
    if (state.mode === "db" && col) { const copy = JSON.parse(JSON.stringify(state.settings)); queue(() => col.doc("settings").set(copy)); }

  /* ---------- actions ---------- */
  function addSet(exId, defer) {
    const w = WMAP[state.w];
    const idx = w.items.findIndex(i => i.ex === exId);
    const it = w.items[idx], e = EXD[exId];
    const d = draftFor(it);

    const old = state.days[key];
    state.days[key] = {
      date: key,
      w: old && old.w ? old.w : state.w,
      deload: old ? !!old.deload : deloadActive(),
      sets: [...(old ? old.sets : []), { ex: exId, kg, reps, t: Date.now() }],
    };
    persistDay(key);
    if (!state.settings.cycleStart) { state.settings.cycleStart = cycleStartKey() || key; persistSettings(); }
    const done = setsFor(key, exId).length;
    let label = `Poilsis · ${e.name}`;
    if (done >= targetSets(it)) {
      const next = w.items.slice(idx + 1).find(i => setsFor(key, i.ex).length < targetSets(i)) || w.items.find(i => setsFor(key, i.ex).length < targetSets(i));
      if (next) { state.open = next.ex; label = `Toliau: ${EXD[next.ex].name}`; }
      else { state.open = null; label = "Treniruotė baigta"; }

    if (label !== "Treniruotė baigta") startTimer(it.rest, label); else stopTimer();

    return true;

    const old = state.days[key]; if (!old) return;
    state.days[key] = Object.assign({}, old, { sets: [] });
    persistDay(key);
    delete state.days[key];
    state.confirmDel = null;
    render();

    const t = todayKey();

  /* ---------- export / import ---------- */
  const trenPl = n => (n % 10 === 1 && n % 100 !== 11 ? "treniruotė" : n % 10 >= 2 && (n % 100 < 10 || n % 100 >= 20) ? "treniruotės" : "treniruočių");
  const ioEsc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const exportJson = () => JSON.stringify({ app: "jegos-zurnalas", v: 1, days: state.days, settings: state.settings });
  function doExport() {
    state.io = "export";
    const txt = exportJson();
    const n = sortedKeys().length;
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => { state.ioMsg = `Nukopijuota: ${n} ${trenPl(n)}. Dabar atidaryk kitą programėlę ir spausk „Importuoti“.`; render(); })
          .catch(() => { state.ioMsg = "Nepavyko nukopijuoti automatiškai. Pažymėk tekstą žemiau ir nukopijuok."; render(); selectIo(); });
        copied = true;
      }
    } catch (e) {}
    if (!copied) state.ioMsg = "Pažymėk tekstą žemiau ir nukopijuok.";
    render(); if (!copied) selectIo();
  }
  function selectIo() { const t = $("io-text"); if (t) { t.focus(); t.select(); try { t.setSelectionRange(0, t.value.length); } catch (e) {} } }
  function doImport() {
    const t = $("io-text"); if (!t) return;
    let data;
    try { data = JSON.parse(t.value.trim()); } catch (e) { state.ioMsg = "Tai ne įrašų tekstas. Nukopijuok jį dar kartą su „Eksportuoti“."; render(); return; }
    if (!data || typeof data.days !== "object") { state.ioMsg = "Tekste nėra įrašų."; render(); return; }
    let added = 0, merged = 0;
    for (const [k, doc] of Object.entries(data.days)) {
      if (!isDayKey(k) || !doc || !Array.isArray(doc.sets)) continue;
      const cur = state.days[k];
      if (!cur) { state.days[k] = JSON.parse(JSON.stringify(doc)); added++; }
      else {
        const have = new Set(cur.sets.map(x => x.t));
        const extra = doc.sets.filter(x => !have.has(x.t));
        if (!extra.length) continue;
        state.days[k] = Object.assign({}, cur, { w: cur.w || doc.w, sets: [...cur.sets, ...extra].sort((a, b) => a.t - b.t) });
        merged++;
      }
      persistDay(k);
    }
    if (data.settings && typeof data.settings === "object") {
      const st = data.settings;
      if (!state.settings.cycleStart && st.cycleStart) state.settings.cycleStart = st.cycleStart;
      if (st.deloadFrom && !state.settings.deloadFrom) { state.settings.deloadFrom = st.deloadFrom; state.settings.deloadTo = st.deloadTo; }
      if (st.bar && !state.settings.bar) state.settings.bar = st.bar;
      persistSettings();
    }
    state.io = null;
    state.ioMsg = `Įkelta naujų treniruočių: ${added}${merged ? `, papildyta: ${merged}` : ""}.`;
    state.draft = {};
    render();
  }

  /* ---------- render ---------- */
  function render() {
    const active = document.activeElement;
    const activeId = active && active.id;
    const sel = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;

    if (!state.w) state.w = defaultWorkout();
    const tk = todayKey();
    const todayW = scheduled(new Date().getDay());
    $("date-label").textContent = longDate(tk);
    $("w-title").textContent = state.view === "train" ? WMAP[state.w].name : state.view === "prog" ? "Progresas" : "Istorija";
    $("days").hidden = state.view !== "train";
    $("days").innerHTML = WORKOUTS.map(w => {
      const done = w.items.every(i => setsFor(tk, i.ex).length >= targetSets(i));
      return `<button type="button" data-action="pick" data-w="${w.id}" aria-pressed="${w.id === state.w}" data-today="${todayW && todayW.id === w.id ? 1 : 0}" data-done="${done ? 1 : 0}"><b>${w.name}</b><small>${DOW_SHORT[w.dow]}</small></button>`;
    }).join("");

    for (const v of ["train", "prog", "hist"]) $(`view-${v}`).hidden = state.view !== v;
    document.querySelectorAll(".tabs [data-v]").forEach(b => b.toggleAttribute("aria-current", false));
    const cur = document.querySelector(`.tabs [data-v="${state.view}"]`); if (cur) cur.setAttribute("aria-current", "page");

    if (state.view === "train") $("view-train").innerHTML = trainHtml();
    if (state.view === "prog") $("view-prog").innerHTML = progHtml();
    if (state.view === "hist") $("view-hist").innerHTML = histHtml();

    if (activeId && $(activeId)) {
      const el = $(activeId); el.focus({ preventScroll: true });
      if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {}
    }
  }

  function cycleHtml() {
    if (deloadActive()) {
      return `<div class="banner" data-t="deload"><span><b>Deload savaitė iki ${shortDate(state.settings.deloadTo)}.</b> ~60 % svorio, perpus mažiau priėjimų. Programėlė jau taip ir siūlo.</span>
        <div class="btns"><button type="button" class="btn" data-action="deload-end">Baigti anksčiau</button></div></div>`;
    }
    const wk = cycleWeek();
    if (!wk) return "";
    const bars = Array.from({ length: 8 }, (_, i) => `<i class="${i < wk ? (i >= 5 ? "due" : "on") : ""}"></i>`).join("");
    if (wk >= 6) {
      return `<div class="banner" data-t="due"><span><b>${wk}-a savaitė be pertraukos.</b> ${wk >= 8 ? "Laikas lengvesnei savaitei." : "Rekomenduojama deload kas 6–8 savaites. Jei svoriai stoja ar jautiesi pavargęs, daryk dabar."}</span>
        <div class="btns"><button type="button" class="btn primary" data-action="deload-start">Pradėti deload savaitę</button></div></div>`;
    }
    return `<div class="cycle"><span class="weeks" aria-hidden="true">${bars}</span><span>Ciklo ${wk}-a savaitė · deload po ${6 - wk}–${8 - wk} sav.</span></div>`;
  }

  function trainHtml() {
    const tk = todayKey();
    const w = WMAP[state.w];
    const ready = state.mode !== "load";
    const todayW = scheduled(new Date().getDay());
    let top = "";
    if (!todayW && !state.wPicked && !(state.days[tk] && state.days[tk].sets.length)) {
      const nx = nextScheduled(tk);
      top = `<div class="banner"><span><b>Šiandien poilsio diena.</b> Kita treniruotė: ${nx.w.name}, ${DOW_LONG[dateOf(nx.k).getDay()]}. Jei vis tiek sportuoji, pasirink dieną viršuje.</span></div>`;
    } else if (todayW && state.w !== todayW.id && !(state.days[tk] && state.days[tk].w === state.w)) {
      top = `<div class="hint">Pagal planą šiandien ${todayW.name}. Rodoma ${w.name}.</div>`;
    }
    const total = w.items.reduce((a, i) => a + targetSets(i), 0);
    const done = w.items.reduce((a, i) => a + Math.min(setsFor(tk, i.ex).length, targetSets(i)), 0);
    const list = w.items.map((it, i) => exHtml(it, i, tk, ready)).join("");
    return `${top}${cycleHtml()}
      <div class="prog"><span class="track"><i style="width:${total ? (100 * done) / total : 0}%"></i></span><span><b>${done}</b> / ${total} priėjimų</span></div>
      <section aria-label="Pratimai"><ol class="exlist">${list}</ol></section>
      ${done >= total && total ? `<div class="banner" data-t="deload"><span><b>Treniruotė baigta.</b> Gerai padirbėta. Kita: ${(nextScheduled(tk) || { w }).w.name}.</span></div>` : ""}`;
  }

  function exHtml(it, i, tk, ready) {
    const e = EXD[it.ex];
    const today = setsFor(tk, it.ex);
    const tgt = targetSets(it);
    const open = state.open === it.ex;
    const dots = Array.from({ length: Math.max(tgt, today.length) }, (_, j) => `<span class="dot${j < today.length ? " on" : ""}"></span>`).join("");
    const perTxt = e.per ? ` / ${e.per}` : "";
    let body = "";
    if (open) {
      const a = advice(it);
      const d = draftFor(it);
      const kgField = e.noKg ? "" : `
        <div class="field">
          <label for="kg-${it.ex}">${e.added ? "Papildomas svoris, kg" : "Svoris, kg"}</label>
          <div class="stepper">
            <button type="button" data-action="step" data-ex="${it.ex}" data-f="kg" data-d="-1" aria-label="Mažinti svorį">−</button>
            <input id="kg-${it.ex}" data-ex="${it.ex}" data-f="kg" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" value="${d.kg}">
            <button type="button" data-action="step" data-ex="${it.ex}" data-f="kg" data-d="1" aria-label="Didinti svorį">+</button>
          </div>
        </div>`;
      body = `
        <div class="logger">
          <div class="advice" data-t="${a.t}">${a.text}${a.last ? `<span class="last">${a.last}</span>` : ""}</div>
          <div class="inputs${e.noKg ? " one" : ""}">${kgField}
            <div class="field">
              <label for="reps-${it.ex}">Pakartojimai${perTxt}</label>
              <div class="stepper">
                <button type="button" data-action="step" data-ex="${it.ex}" data-f="reps" data-d="-1" aria-label="Mažinti pakartojimus">−</button>
                <input id="reps-${it.ex}" data-ex="${it.ex}" data-f="reps" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="${d.reps}">
                <button type="button" data-action="step" data-ex="${it.ex}" data-f="reps" data-d="1" aria-label="Didinti pakartojimus">+</button>
              </div>
            </div>
          </div>
          ${e.added ? `<span class="hint">Tik papildomas svoris ant diržo, 0 = be svorio</span>` : e.note ? `<span class="hint">${e.note}</span>` : ""}
          ${e.bar ? `<div class="plates" id="plates-${it.ex}">${platesHtml(parseNum(d.kg))}</div>` : ""}
          ${addBtn(it, today, tgt, ready)}
          ${today.length ? `<div class="today">${today.map(x => `
            <span class="chip${x.reps < it.lo ? " miss" : ""}"><span class="num">${e.noKg ? `${x.reps} pak.` : `${fmt(x.kg)} × ${x.reps}`}</span>
              <button type="button" class="x" data-action="del-set" data-k="${tk}" data-t="${x.t}" aria-label="Ištrinti priėjimą">×</button></span>`).join("")}</div>` : ""}
        </div>`;
    }
    return `
      <li class="ex" data-open="${open ? 1 : 0}" data-done="${today.length >= tgt ? 1 : 0}">
        <button type="button" class="ex-row" data-action="toggle" data-ex="${it.ex}" aria-expanded="${open}">
          <span class="ex-idx">${i + 1}</span>
          <span><span class="ex-name">${e.name}</span><span class="ex-meta"><span class="tgt">${tgt} × ${repsTxt(it)}${perTxt}</span> · poilsis ${restTxt(it.rest)}</span></span>
          <span class="dots" aria-label="${today.length} iš ${tgt}">${dots}</span>
        </button>${body}
      </li>`;
  }

  function addBtn(it, today, tgt, ready) {
    const label = today.length >= tgt ? "Pridėti papildomą priėjimą" : `Pridėti ${today.length + 1}-ą priėjimą`;
    const tk = todayKey();
    const left = WMAP[state.w].items.reduce((a, i) => a + Math.max(0, targetSets(i) - setsFor(tk, i.ex).length), 0);
    const lastSet = today.length < tgt && left <= 1;
    if (IS_PWA && ready && state.settings.iosTimer !== false && !lastSet) {
      return `<a class="add" href="${shortcutHref(it.rest)}" data-action="add" data-ex="${it.ex}">${label}</a>`;
    }
    return `<button type="button" class="add" data-action="add" data-ex="${it.ex}" ${ready ? "" : "disabled"}>${label}</button>`;
  }

  function sessionsFor(ex) {
    return sortedKeys().filter(k => !state.days[k].deload).map(k => {
      const st = setsFor(k, ex);
      if (!st.length) return null;
      const top = Math.max(...st.map(x => x.kg));
      const best = st.filter(x => x.kg === top).sort((a, b) => b.reps - a.reps)[0];
      const e1 = Math.max(...st.map(x => x.kg * (1 + x.reps / 30)));
      return { k, kg: top, reps: best.reps, maxReps: Math.max(...st.map(x => x.reps)), e1, vol: st.reduce((a, x) => a + x.kg * x.reps, 0) };
    }).filter(Boolean);
  }

  function progHtml() {
    const seen = new Set();
    const opts = WORKOUTS.map(w => {
      const items = w.items.filter(i => !seen.has(i.ex) && seen.add(i.ex));
      return items.length ? `<optgroup label="${w.name}">${items.map(i => `<option value="${i.ex}"${i.ex === state.chartEx ? " selected" : ""}>${EXD[i.ex].name}</option>`).join("")}</optgroup>` : "";
    }).join("");
    const recs = EX_ORDER.map(ex => {
      const ss = sessionsFor(ex);
      if (!ss.length) return "";
      const e = EXD[ex];
      const useReps = ss.every(p => p.kg === 0);
      const best = ss.reduce((a, b) => (useReps ? (b.maxReps > a.maxReps ? b : a) : (b.kg > a.kg || (b.kg === a.kg && b.reps > a.reps) ? b : a)));
      const bestE1 = Math.max(...ss.map(p => p.e1));
      const v = useReps ? `${best.maxReps} pak.` : `${fmt(best.kg)} kg × ${best.reps}`;
      const sub = `${shortDate(best.k)}${e.bar && !useReps ? ` · apskaičiuotas 1RM ~${fmt(Math.round(bestE1))} kg` : ""}${e.added && !useReps ? " · papildomas svoris" : ""}`;
      return `<li><button type="button" data-action="chart" data-ex="${ex}"><span class="n">${e.name}</span><span class="v">${v}</span><span class="s">${sub}</span></button></li>`;
    }).join("");
    return `
      <section aria-labelledby="h-chart">
        <h2 id="h-chart">Grafikas</h2>
        <select class="picker" id="chart-ex" aria-label="Pratimas">${opts}</select>
        <div class="chart">${chartHtml(state.chartEx)}</div>
      </section>
      <section aria-labelledby="h-rec">
        <h2 id="h-rec">Rekordai</h2>
        ${recs ? `<ul class="records">${recs}</ul>` : `<div class="empty-state">Rekordai atsiras, kai įrašysi pirmus priėjimus.</div>`}
      </section>`;
  }

  function chartHtml(ex) {
    const e = EXD[ex];
    const pts = sessionsFor(ex);
    if (pts.length < 2) {
      return `<div class="empty">${pts.length ? "Dar viena treniruotė, ir čia atsiras grafikas." : `Kai įrašysi bent 2 treniruotes su „${e.name}“, čia matysi, kaip auga svoris.`}</div>`;
    }
    const useReps = pts.every(p => p.kg === 0);
    const val = p => (useReps ? p.maxReps : p.kg);
    const W = 360, H = 190, L = 36, R = 8, T = 24, B = 24;
    let lo = Math.min(...pts.map(val)), hi = Math.max(...pts.map(val));
    const span = hi - lo || Math.max(hi * 0.2, 5);
    const stepRaw = span / 3;
    const mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= stepRaw);
    lo = Math.max(0, Math.floor((lo - span * 0.1) / step) * step);
    hi = Math.ceil((hi + span * 0.1) / step) * step;
    if (hi === lo) hi = lo + step;
    const x = i => L + (i * (W - L - R)) / (pts.length - 1);
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(val(p)).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts.length - 1).toFixed(1)},${H - B} L${L},${H - B} Z`;
    const last = pts[pts.length - 1], first = pts[0];
    const lx = x(pts.length - 1), ly = y(val(last));
    const delta = val(last) - val(first);
    const best = pts.reduce((a, b) => (val(b) > val(a) || (val(b) === val(a) && b.reps > a.reps) ? b : a));
    const unit = useReps ? " pak." : " kg";
    return `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${useReps ? "Daugiausiai pakartojimų" : "Sunkiausias priėjimas"} per treniruotę">
        ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--display)">${fmt(v)}</text>`).join("")}
        <path d="${area}" fill="var(--accent)" fill-opacity="0.12"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(val(p))}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
        <text x="${Math.min(lx, W - R)}" y="${Math.max(ly - 11, 14)}" text-anchor="end" font-size="14" font-weight="600" fill="var(--ink)" font-family="var(--display)">${useReps ? `${last.maxReps} pak.` : `${fmt(last.kg)} kg × ${last.reps}`}</text>
        <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)" font-family="var(--body)">${shortDate(first.k)}</text>
        <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--body)">${shortDate(last.k)}</text>
      </svg>
      <div class="stats">
        <span class="stat">Rekordas<b>${useReps ? `${best.maxReps} pak.` : `${fmt(best.kg)}×${best.reps}`}</b></span>
        <span class="stat">Pokytis<b>${delta > 0 ? "+" : ""}${fmt(delta)}${unit}</b></span>
        <span class="stat">Treniruočių<b>${pts.length}</b></span>
      </div>
      <div class="hint" style="margin-top:8px">${useReps ? "Daugiausiai pakartojimų per treniruotę." : `Sunkiausias treniruotės priėjimas${e.added ? " (papildomas svoris)" : ""}. Deload savaitės nerodomos.`}</div>`;
  }

  function histHtml() {
    const keys = sortedKeys().reverse();
    const list = !keys.length
      ? `<li class="empty-state">Čia bus tavo treniruotės. Skiltyje „Treniruotė“ atidaryk pratimą, įvesk svorį ir pakartojimus ir spausk „Pridėti“.</li>`
      : keys.slice(0, state.histLimit).map(k => {
        const doc = state.days[k];
        const wid = inferWorkout(doc);
        const editing = state.editDay === k;
        const exs = [...new Set(doc.sets.map(x => x.ex))].sort((a, b) => EX_ORDER.indexOf(a) - EX_ORDER.indexOf(b));
        const rows = exs.map(ex => {
          const e = EXD[ex] || { name: ex };
          const st = setsFor(k, ex);
          return `<div class="day-row"><span>${e.name}</span><span class="sets">${st.map(x => `<span>${e.noKg ? x.reps : `${fmt(x.kg)}×${x.reps}`}${editing ? `<button type="button" class="x" data-action="del-set" data-k="${k}" data-t="${x.t}" aria-label="Ištrinti">×</button>` : ""}</span>`).join("")}</span></div>`;
        }).join("");
        const confirming = state.confirmDel === k;
        return `<li class="day">
          <div class="day-head"><span class="day-date">${longDate(k)}${wid ? `<span class="pill">${WMAP[wid].name}</span>` : ""}${doc.deload ? `<span class="pill dl">Deload</span>` : ""}</span>
            <span>${confirming
              ? `<button type="button" class="link danger" data-action="del-day" data-k="${k}">Taip, ištrinti</button><button type="button" class="link" data-action="del-cancel">Atšaukti</button>`
              : editing
                ? `<button type="button" class="link danger" data-action="del-ask" data-k="${k}">Ištrinti dieną</button><button type="button" class="link" data-action="edit-day" data-k="">Baigti</button>`
                : `<button type="button" class="link" data-action="edit-day" data-k="${k}">Taisyti</button>`}</span>
          </div>${rows}</li>`;
      }).join("");
    const more = keys.length > state.histLimit ? `<button type="button" class="btn" data-action="more">Rodyti daugiau</button>` : "";
    const bar = state.settings.bar || 20;
    const c = cycleStartKey();
    return `
      <section aria-labelledby="h-hist"><h2 id="h-hist">Treniruotės</h2><ul class="hist">${list}</ul>${more ? `<div style="margin-top:10px">${more}</div>` : ""}</section>
      <section aria-labelledby="h-set">
        <h2 id="h-set">Nustatymai</h2>
        <div class="settings">
          <div class="setting"><span>Štangos svoris</span>
            <span class="seg">${[20, 15].map(b => `<button type="button" data-action="bar" data-b="${b}" aria-pressed="${bar === b}">${b} kg</button>`).join("")}</span></div>
          <div class="setting"><span>Ciklas ${c ? `nuo ${shortDate(c)}` : "dar neprasidėjo"}${deloadActive() ? " · dabar deload" : ""}</span>
            ${deloadActive() ? `<button type="button" class="btn" data-action="deload-end">Baigti deload</button>` : `<button type="button" class="btn" data-action="deload-start">Pradėti deload</button>`}</div>
          ${IS_PWA ? `
          <div class="setting"><span>Paleisti iPhone laikmatį po priėjimo</span>
            <span class="seg">${[["0", "Ne"], ["1", "Taip"]].map(([v, t]) => `<button type="button" data-action="ios" data-on="${v}" aria-pressed="${(state.settings.iosTimer !== false) === (v === "1")}">${t}</button>`).join("")}</span></div>
          ${state.settings.iosTimer !== false ? `<div class="hint">Reikia Shortcuts nuorodos „${SHORTCUT}“: <b>Get numbers from Shortcut Input</b> → <b>Start Timer for Numbers seconds</b>. Išbandyk: <a href="${shortcutHref(10)}">paleisti 10 s laikmatį</a>.</div>` : ""}` : `
          <div class="hint">Programėlė su automatiniu iPhone laikmačiu: <b>${PWA_URL}</b>. Ten perkelk įrašus su „Eksportuoti“ ir „Importuoti“.</div>`}
          <div class="setting"><span>Įrašų perkėlimas</span>
            <span class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-action="export">Eksportuoti</button><button type="button" class="btn" data-action="import-open">Importuoti</button></span></div>
          ${state.io === "export" ? `<textarea id="io-text" class="io" readonly rows="4">${ioEsc(exportJson())}</textarea>` : ""}
          ${state.io === "import" ? `<textarea id="io-text" class="io" rows="4" placeholder="Įklijuok čia nukopijuotus įrašus"></textarea><div><button type="button" class="btn primary" data-action="import-do">Įkelti įrašus</button></div>` : ""}
          ${state.ioMsg ? `<div class="hint"><b>${state.ioMsg}</b></div>` : ""}
          <div class="hint">${state.mode === "db" ? "Įrašai saugomi tavo claude.ai paskyroje ir matomi tik tau." : state.mode === "local" ? (IS_PWA ? "Įrašai saugomi šiame telefone. Kartais pasidaryk atsarginę kopiją su „Eksportuoti“ ir išsisaugok ją, pvz., Notes programėlėje." : "Įrašai saugomi tik šioje naršyklėje. Išvalius naršyklės duomenis, jie dings.") : "Jungiamasi…"}</div>
        </div>
      </section>`;
  }

  /* ---------- rest timer ---------- */
  const timer = Object.assign({ end: 0, total: 0, label: "", done: false, id: null, doneAt: 0 }, lsGet(LS_TIMER, {}));
  const keep = { lock: null, video: null };
  let audio = null;

  function unlockAudio() {
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        const b = audio.createBuffer(1, 1, 22050), src = audio.createBufferSource();
        src.buffer = b; src.connect(audio.destination); src.start(0);
      }
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }
  function beep() {
    try {
      if (audio) {
        if (audio.state === "suspended") audio.resume();
        [0, 0.3, 0.6].forEach(dt => {
          const o = audio.createOscillator(), g = audio.createGain();
          o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
          const t0 = audio.currentTime + dt;
          g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
          o.start(t0); o.stop(t0 + 0.25);
        });
      }
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 250]); } catch (e) {}
    const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
  }

  function awakeOn() { return !!keep.lock || !!(keep.video && !keep.video.paused); }
  function showAwake() {
    const t = timer.end ? (awakeOn() ? "Ekranas neužges" : "Ekranas gali užgesti, laikas vis tiek skaičiuojamas") : "";
    $("awake-small").textContent = t; $("awake-big").textContent = t;
  }
  function keepAwake(on) {
    if (on) {
      try {
        if (!keep.video) {
          const v = document.createElement("video");
          v.setAttribute("playsinline", ""); v.setAttribute("muted", ""); v.setAttribute("aria-hidden", "true");
          v.muted = true; v.loop = true; v.src = KEEP_SRC; v.className = "keepvid";
          v.addEventListener("playing", showAwake); v.addEventListener("pause", showAwake);
          document.body.appendChild(v); keep.video = v;
        }
        const p = keep.video.play(); if (p && p.catch) p.catch(() => {});
      } catch (e) {}
      try {
        if (!keep.lock && navigator.wakeLock && document.visibilityState === "visible") {
          navigator.wakeLock.request("screen").then(l => {
            keep.lock = l; l.addEventListener("release", () => { keep.lock = null; showAwake(); }); showAwake();
          }).catch(() => showAwake());
        }
      } catch (e) {}
    } else {
      try { if (keep.lock) keep.lock.release(); } catch (e) {}
      keep.lock = null;
      try { if (keep.video) keep.video.pause(); } catch (e) {}
    }
    showAwake();
  }

  function saveTimer() { lsSet(LS_TIMER, { end: timer.end, total: timer.total, label: timer.label, done: timer.done, doneAt: timer.doneAt }); }
  function startTimer(sec, label) {
    timer.total = sec; timer.end = Date.now() + sec * 1000; timer.label = label; timer.done = false; timer.doneAt = 0;
    saveTimer(); showTimer(); keepAwake(true);
  }
  function stopTimer() {
    clearInterval(timer.id); timer.id = null; timer.end = 0; timer.done = false;
    saveTimer();
    $("timer").hidden = true; $("big").hidden = true;
    keepAwake(false);
  }
  function showTimer() {
    $("timer").hidden = false;
    clearInterval(timer.id); timer.id = setInterval(tick, 250); tick();
  }
  function tick() {
    if (!timer.end) return;
    const now = Date.now();
    const leftMs = timer.end - now;
    const left = Math.max(0, Math.ceil(leftMs / 1000));
    if (leftMs <= 0 && !timer.done) {
      timer.done = true; timer.doneAt = timer.end; saveTimer();
      if (document.visibilityState === "visible" && now - timer.end < 4000) beep();
    }
    const over = timer.done ? Math.floor((now - timer.end) / 1000) : 0;
    const txt = timer.done ? `+${mmss(over)}` : mmss(left);
    const label = timer.done ? "Laikas kitam priėjimui" : timer.label;
    const frac = timer.done ? 1 : 1 - leftMs / (timer.total * 1000);
    $("timer").dataset.done = timer.done ? "1" : "0";
    $("big").dataset.done = timer.done ? "1" : "0";
    $("timer-time").textContent = txt; $("big-time").textContent = txt;
    $("timer-label").textContent = label; $("big-label").textContent = timer.done ? `${label} · ${timer.label}` : label;
    $("timer-fill").style.width = `${Math.min(100, Math.max(0, frac * 100))}%`;
    $("big-arc").style.strokeDashoffset = String(282.74 * Math.min(1, Math.max(0, frac)));
    if (timer.done && over > 180 && awakeOn()) keepAwake(false);
    if (timer.done && over > 900) stopTimer();
  }
  function adjustTimer(sec) {
    if (!timer.end) return;
    if (timer.done && sec > 0) { startTimer(sec, timer.label); return; }
    timer.end += sec * 1000; timer.total = Math.max(1, timer.total + sec);
    saveTimer(); tick();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && timer.end) { tick(); if (!timer.done) keepAwake(true); }
  });

  /* ---------- events ---------- */
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-action]"); if (!b) return;
    const a = b.dataset.action, ex = b.dataset.ex;
    if (a === "toggle") { state.open = state.open === ex ? null : ex; render(); }
    else if (a === "pick") { state.w = b.dataset.w; state.wPicked = true; state.open = null; render(); window.scrollTo({ top: 0 }); }
    else if (a === "view") { state.view = b.dataset.v; lsSet(LS_VIEW, state.view); render(); window.scrollTo({ top: 0 }); }
    else if (a === "step") {
      const it = WMAP[state.w].items.find(i => i.ex === ex), e = EXD[ex], d = draftFor(it), f = b.dataset.f, dir = +b.dataset.d;
      const curV = parseNum(d[f]) || 0;
      const next = f === "kg" ? Math.max(0, +(curV + dir * e.step).toFixed(2)) : Math.max(1, Math.round(curV) + dir);
      d[f] = f === "kg" ? numStr(next) : String(next);
      const inp = $(`${f}-${ex}`); if (inp) inp.value = d[f];
      if (f === "kg" && e.bar) { const p = $(`plates-${ex}`); if (p) p.innerHTML = platesHtml(next); }
    }
    else if (a === "add") {
      if (b.tagName === "A") { if (!addSet(ex, true)) ev.preventDefault(); }
      else addSet(ex);
    }
    else if (a === "export") doExport();
    else if (a === "import-open") { state.io = state.io === "import" ? null : "import"; state.ioMsg = ""; render(); const t = $("io-text"); if (t) t.focus(); }
    else if (a === "import-do") doImport();
    else if (a === "ios") { state.settings.iosTimer = b.dataset.on === "1"; persistSettings(); render(); }
    else if (a === "del-set") removeSet(b.dataset.k, +b.dataset.t);
    else if (a === "chart") { state.chartEx = ex; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (a === "del-ask") { state.confirmDel = b.dataset.k; render(); }
    else if (a === "del-cancel") { state.confirmDel = null; render(); }
    else if (a === "del-day") { removeDay(b.dataset.k); state.editDay = null; }
    else if (a === "edit-day") { state.editDay = b.dataset.k || null; state.confirmDel = null; render(); }
    else if (a === "more") { state.histLimit += 15; render(); }
    else if (a === "bar") { state.settings.bar = +b.dataset.b; persistSettings(); render(); }
    else if (a === "deload-start") startDeload();
    else if (a === "deload-end") endDeload();
    else if (a === "timer-add") adjustTimer(30);
    else if (a === "timer-sub") adjustTimer(-15);
    else if (a === "timer-stop") stopTimer();
    else if (a === "big-open") { $("big").hidden = false; keepAwake(!timer.done); tick(); }
    else if (a === "big-close") $("big").hidden = true;
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "chart-ex") { state.chartEx = ev.target.value; render(); }
  });
  document.addEventListener("input", ev => {
    const el = ev.target; if (!el.dataset || !el.dataset.ex || !el.dataset.f) return;
    const it = WMAP[state.w].items.find(i => i.ex === el.dataset.ex); if (!it) return;
    draftFor(it)[el.dataset.f] = el.value;
    if (el.dataset.f === "kg" && EXD[it.ex].bar) { const p = $(`plates-${it.ex}`); if (p) p.innerHTML = platesHtml(parseNum(el.value)); }
  });
  document.addEventListener("keydown", ev => {
    const el = ev.target;
    if (ev.key === "Enter" && el.dataset && el.dataset.ex && el.dataset.f) { ev.preventDefault(); el.blur(); addSet(el.dataset.ex); }
  });
  document.addEventListener("focusin", ev => { if (ev.target.matches && ev.target.matches(".stepper input")) setTimeout(() => { try { ev.target.select(); } catch (e) {} }, 0); });

  render();
  if (timer.end) {
    if (Date.now() - timer.end > 900000) stopTimer(); else showTimer();
  }
  initStore();
})();
</script>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
